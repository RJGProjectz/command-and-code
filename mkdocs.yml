site_name: Command & Code
site_description: The practical security operations field manual.
site_author: Command & Code
# Set these to your GitHub repository before deploying.
site_url: https://rjgprojectz.github.io/command-and-code/
repo_url: https://github.com/RJGProjectz/command-and-code
repo_name: command-and-code
edit_uri: edit/main/docs/
copyright: Command & Code — The practical security operations field manual.

theme:
  name: material
  custom_dir: overrides
  # No web fonts: the site stays fast and fully usable offline.
  font: false
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # Breadcrumbs, section landing pages, and only the current branch in the sidebar DOM.
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/cc.css
  - assets/stylesheets/cc-themes.css
  - assets/stylesheets/cc-poster.css
  - assets/stylesheets/cc-interactive.css

extra_javascript:
  - assets/javascripts/cc-themes.js
  - assets/javascripts/cc-poster.js
  - assets/javascripts/cc-interactive.js
  - assets/javascripts/cc-recent.js
  - assets/javascripts/cc-tables.js
  - assets/javascripts/cc-graph.js
  - assets/javascripts/cc-facets.js

hooks:
  - hooks/cc_meta.py

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags

# Linked from the footer About links (overrides/partials/copyright.html), not the tabs.
not_in_nav: |
  /executive-summary.md
  /roadmap.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [scripts]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

