{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cc-theme') || 'classic';
        if (t === 'nexus-flow' || t === 'nexus-cyber') t = 'nexus';
        if (t === 'electric-xtra' || t === 'electric-cyber') t = 'high-voltage';
        if (t === 'matrix-green' || t === 'matrix') t = 'catrix';
        if (t === 'crimson-alert' || t === 'war-room' || t === 'red-cell') t = 'crimson';
        document.documentElement.setAttribute('data-cc-theme', t);
      } catch (e) {}
    })();
  </script>
{% endblock %}
