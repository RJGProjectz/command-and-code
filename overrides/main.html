{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cc-theme') || 'classic';
        if (t === 'nexus-flow') t = 'nexus-cyber';
        if (t === 'electric-xtra') t = 'electric-cyber';
        document.documentElement.setAttribute('data-cc-theme', t);
      } catch (e) {}
    })();
  </script>
{% endblock %}
