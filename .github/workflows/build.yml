name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate front matter and browse tables
        run: python tools/cc.py check

      - name: Check code block and script syntax
        run: python tools/cc.py code

      - name: Run PSScriptAnalyzer on PowerShell scripts
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path scripts/powershell -Severity Warning -Recurse
          if ($issues) {
            $issues | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s)."
            exit 1
          } else {
            Write-Host "PSScriptAnalyzer passed with no warnings or errors."
          }

      - name: Strict MkDocs build
        run: mkdocs build --strict
