name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate front matter and browse tables
        run: python tools/cc.py check

      - name: Check code block and script syntax
        run: python tools/cc.py code

      - name: Strict MkDocs build
        run: mkdocs build --strict

      # WP-12: cc ask retrieval must keep finding an expected page for 80% of the eval set.
      - name: Evaluate cc ask retrieval
        run: python tools/ask_eval.py --min-hit 0.95

  pester:
    name: Pester tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Pester suites
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck --version && shellcheck -S warning scripts/bash/*.sh

      - name: PSScriptAnalyzer (fails on findings not in tests/lint/pssa-baseline.json)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          ./tests/lint/Invoke-PSScriptAnalyzerGate.ps1

  pytest:
    name: Python tool tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest tests/python -q -p no:cacheprovider
